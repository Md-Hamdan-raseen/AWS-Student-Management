<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>

        <!-- Add Student Button -->
        <a href="/add" class="btn">Add Student</a>

        <!-- Student Table -->
        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Age</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

                {% for student in students %}

                <tr>

                    <td>{{ student[0] }}</td>

                    <td>{{ student[1] }}</td>

                    <td>{{ student[2] }}</td>

                    <td>{{ student[3] }}</td>

                    <td>{{ student[4] }}</td>

                    <td>
                        <!-- Edit -->
                        <a href="/edit/{{ student[0] }}">
                            Edit
                        </a>

                        |

                        <!-- Delete -->
                        <a href="/delete/{{ student[0] }}"
                           class="delete"
                           onclick="return confirm('Are you sure you want to delete this student?')">
                            Delete
                        </a>
                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</body>
</html>
